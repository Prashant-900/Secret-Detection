name: Secret Scan

on:
  push:
    branches-ignore:
      - main          # fast-scan runs on push to any feature branch
  pull_request:
    branches:
      - main          # deep-llm-scan runs on pull requests targeting main

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Tier 1: Fast Gate (Pushes on Feature Branches) ──────────────────────────
  fast-scan:
    name: Fast Scan (GBM re-ranker)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2        # fetch history to diff against previous commit

      - name: Get changed files
        id: changed-files
        run: |
          # Diff against the previous commit
          FILES=$(git diff --name-only --diff-filter=ACMRT HEAD~1 HEAD 2>/dev/null || git ls-files)
          
          # Filter out test fixtures and dataset directories
          SCAN_FILES=""
          for f in $FILES; do
            case "$f" in
              tests/*|Dataset/*|.github/*) ;;
              *) [ -f "$f" ] && SCAN_FILES="$SCAN_FILES $f" ;;
            esac
          done

          SCAN_FILES=$(echo "$SCAN_FILES" | xargs)
          echo "files=$SCAN_FILES" >> "$GITHUB_OUTPUT"
          echo "Files to scan: $SCAN_FILES"

      - name: Run fast secret scan
        if: steps.changed-files.outputs.files != ''
        id: scan
        uses: ./.github/actions/secret-scanner-action
        with:
          target: ${{ steps.changed-files.outputs.files }}
          mode: 'fast'
          sarif-output: 'fast-scan.sarif'

      - name: Skip scan if no applicable files changed
        if: steps.changed-files.outputs.files == ''
        run: echo "No scannable code or IaC files were modified in this commit."

  # ── Tier 2: Deep LLM Gate (Pull Requests Targeting main) ─────────────────────
  deep-llm-scan:
    name: Deep LLM Scan (CodeBERT + UniXcoder)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history to diff against PR base branch

      - name: Get changed files in PR
        id: changed-files
        run: |
          # Diff against target branch (origin/main)
          FILES=$(git diff --name-only --diff-filter=ACMRT origin/${{ github.base_ref }}...HEAD)
          
          # Filter out test fixtures and dataset directories
          SCAN_FILES=""
          for f in $FILES; do
            case "$f" in
              tests/*|Dataset/*|.github/*) ;;
              *) [ -f "$f" ] && SCAN_FILES="$SCAN_FILES $f" ;;
            esac
          done

          SCAN_FILES=$(echo "$SCAN_FILES" | xargs)
          echo "files=$SCAN_FILES" >> "$GITHUB_OUTPUT"
          echo "Files to scan: $SCAN_FILES"

      - name: Cache model bundle
        if: steps.changed-files.outputs.files != ''
        id: cache-model
        uses: actions/cache@v4
        with:
          path: ~/.secret-scanner-model
          key: secret-scanner-model-v1



      - name: Run deep LLM secret scan
        if: steps.changed-files.outputs.files != ''
        id: scan
        uses: ./.github/actions/secret-scanner-action
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        with:
          target: ${{ steps.changed-files.outputs.files }}
          mode: 'llm'
          bundle-url: 'https://huggingface.co/yasoob12/v1_codebert_unix/resolve/main/model_bundle.tar.gz'
          sarif-output: 'llm-scan.sarif'

      - name: Skip scan if no applicable files changed
        if: steps.changed-files.outputs.files == ''
        run: echo "No scannable code or IaC files were modified in this PR."